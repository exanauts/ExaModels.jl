name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  github:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        julia-version: ['1', 'lts']
        julia-arch: [x64]
        os: [ubuntu-latest,windows-latest]
    steps:
      - uses: actions/checkout@v2
      - uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@latest
      - name: Run tests
        run: |
          julia --startup-file=no --color=yes --code-coverage=user --project=./test -e '
            using Pkg
            Pkg.develop(path=".")
            Pkg.instantiate()
            include("test/runtests.jl")'
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.julia-version == '1' && matrix.os == 'ubuntu-latest'
      - uses: codecov/codecov-action@v5
        if: matrix.julia-version == '1' && matrix.os == 'ubuntu-latest'
        with:
          files: lcov.info

  cpu:
    strategy:
      matrix:
        julia-version: ['1', 'lts']
        julia-arch: [x64]
        os: [ubuntu-latest]
    runs-on: ['self-hosted', 'examodels']
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    - name: Setup Julia
      uses: julia-actions/setup-julia@latest
      with:
        version: ${{ matrix.julia-version }}
    - name: Setup tests
      run: |
        julia --startup-file=no --color=yes --project=./test -e '
          using Pkg
          Pkg.Registry.update()
          Pkg.develop(path=".")
          Pkg.instantiate()'
    - name: Add OpenCL.jl to test environment
      run: |
        julia --startup-file=no --project=test -e 'using Pkg; Pkg.add(["OpenCL", "pocl_jll"])'
    - name: Run tests
      env:
        EXAMODELS_SKIP_AOT: "1"
      run: |
        julia --startup-file=no --color=yes --project=./test -e '
          push!(ARGS, "EXAMODELS_NO_TEST_CPU")
          push!(ARGS, "EXAMODELS_TEST_KA")
          push!(ARGS, "EXAMODELS_TEST_POCL")
          include("test/runtests.jl")'

  gpu:
    strategy:
      matrix:
        julia-version: ['1', 'lts']
        julia-arch: [x64]
        os: [ubuntu-latest]
        backend: ['cuda', 'amdgpu', 'oneapi']
        exclude:
          - julia-version: 'lts'
            backend: 'oneapi'
    runs-on: ['self-hosted', 'gpu', '${{ matrix.backend }}', 'examodels']
    continue-on-error: ${{ matrix.backend == 'oneapi' }}
    env:
      # oneAPI specific variables
      OverrideDefaultFP64Settings: ${{ matrix.backend == 'oneapi' && '1' || '' }}
      IGC_EnableDPEmulation: ${{ matrix.backend == 'oneapi' && '1' || '' }}
      # opt out of MPS on the self-hosted runner
      CUDA_MPS_PIPE_DIRECTORY: /tmp/no-mps-${{ github.run_id }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    - name: Setup Julia
      uses: julia-actions/setup-julia@latest
      with:
        version: ${{ matrix.julia-version }}
    - name: Setup tests
      run: |
        julia --startup-file=no --color=yes --project=./test -e '
          using Pkg
          Pkg.Registry.update()
          Pkg.develop(path=".")
          Pkg.instantiate()'
    - name: Add AMDGPU.jl to test environment
      if: matrix.backend == 'amdgpu'
      run: |
        julia --startup-file=no --project=test -e 'using Pkg; Pkg.add("AMDGPU")'
    - name: Add CUDA.jl to test environment
      if: matrix.backend == 'cuda'
      run: |
        julia --startup-file=no --project=test -e 'using Pkg; Pkg.add("CUDA")'
    - name: Add oneAPI.jl to test environment
      if: matrix.backend == 'oneapi'
      run: |
        julia --startup-file=no --project=test -e 'using Pkg; Pkg.add("oneAPI")'
    - name: Run tests
      env:
        EXAMODELS_SKIP_AOT: "1"
      run: |
        julia --startup-file=no --color=yes --project=./test -e '
          push!(ARGS, "EXAMODELS_NO_TEST_CPU")
          push!(ARGS, "EXAMODELS_TEST_" * uppercase("${{ matrix.backend }}"))
          include("test/runtests.jl")'

  metal:
    strategy:
      matrix:
        julia-version: ['1', 'lts']
        julia-arch: [aarch64]
        os: [macos-latest]
        backend: ['metal']
    runs-on: ['self-hosted', 'gpu', '${{ matrix.backend }}', 'examodels']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Julia
        uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.julia-version }}
      - name: Setup tests
        run: |
          julia --startup-file=no --color=yes --project=./test -e '
            using Pkg
            Pkg.Registry.update()
            Pkg.develop(path=".")
            Pkg.instantiate()'
      - name: Add Metal.jl to test environment
        run: |
          julia --startup-file=no --project=test -e 'using Pkg; Pkg.add("Metal")'
      - name: Show platform info
        run: |
          uname -a
          julia --startup-file=no -e 'println(Sys.ARCH); println(Sys.KERNEL)'
      - name: Run tests
        run: |
          julia --startup-file=no --color=yes --project=./test -e '
            push!(ARGS, "EXAMODELS_NO_TEST_CPU")
            push!(ARGS, "EXAMODELS_TEST_METAL")
            include("test/runtests.jl")'

  # ── Benchmarks (run after all tests pass, PRs only) ───────────────────────────
  bench-nothing:
    if: github.event_name == 'pull_request'
    needs: [github, cpu, gpu, metal]
    runs-on: ['self-hosted', 'examodels']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'
      - name: Instantiate
        working-directory: benchmark
        run: |
          julia --startup-file=no --project=main    -e 'using Pkg; Pkg.Registry.update(); Pkg.instantiate()'
          julia --startup-file=no --project=current -e 'using Pkg; Pkg.Registry.update(); Pkg.instantiate()'
      - name: Run benchmark (main)
        working-directory: benchmark
        run: julia --startup-file=no runbenchmark.jl main nothing
      - name: Run benchmark (current)
        working-directory: benchmark
        run: julia --startup-file=no runbenchmark.jl current nothing
      - uses: actions/upload-artifact@v4
        with:
          name: results-nothing
          path: benchmark/benchmark-results-*.csv

  bench-cuda:
    if: github.event_name == 'pull_request'
    needs: [github, cpu, gpu, metal]
    runs-on: ['self-hosted', 'gpu', 'cuda', 'examodels']
    env:
      # opt out of MPS on the self-hosted runner
      CUDA_MPS_PIPE_DIRECTORY: /tmp/no-mps-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'
      - name: Instantiate
        working-directory: benchmark
        run: |
          julia --startup-file=no --project=main    -e 'using Pkg; Pkg.Registry.update(); Pkg.instantiate(); Pkg.add("CUDA")'
          julia --startup-file=no --project=current -e 'using Pkg; Pkg.Registry.update(); Pkg.instantiate(); Pkg.add("CUDA")'
      - name: Run benchmark (main)
        working-directory: benchmark
        run: julia --startup-file=no runbenchmark.jl main cuda
      - name: Run benchmark (current)
        working-directory: benchmark
        run: julia --startup-file=no runbenchmark.jl current cuda
      - uses: actions/upload-artifact@v4
        with:
          name: results-cuda
          path: benchmark/benchmark-results-*.csv

  bench-amdgpu:
    if: github.event_name == 'pull_request'
    needs: [github, cpu, gpu, metal]
    runs-on: ['self-hosted', 'gpu', 'amdgpu', 'examodels']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'
      - name: Instantiate
        working-directory: benchmark
        run: |
          julia --startup-file=no --project=main    -e 'using Pkg; Pkg.Registry.update(); Pkg.instantiate(); Pkg.add("AMDGPU")'
          julia --startup-file=no --project=current -e 'using Pkg; Pkg.Registry.update(); Pkg.instantiate(); Pkg.add("AMDGPU")'
      - name: Run benchmark (main)
        working-directory: benchmark
        run: julia --startup-file=no runbenchmark.jl main amdgpu
      - name: Run benchmark (current)
        working-directory: benchmark
        run: julia --startup-file=no runbenchmark.jl current amdgpu
      - uses: actions/upload-artifact@v4
        with:
          name: results-amdgpu
          path: benchmark/benchmark-results-*.csv

  bench-oneapi:
    if: github.event_name == 'pull_request'
    needs: [github, cpu, gpu, metal]
    runs-on: ['self-hosted', 'gpu', 'oneapi', 'examodels']
    continue-on-error: true
    env:
      OverrideDefaultFP64Settings: '1'
      IGC_EnableDPEmulation: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'
      - name: Instantiate
        working-directory: benchmark
        run: |
          julia --startup-file=no --project=main    -e 'using Pkg; Pkg.Registry.update(); Pkg.instantiate(); Pkg.add("oneAPI")'
          julia --startup-file=no --project=current -e 'using Pkg; Pkg.Registry.update(); Pkg.instantiate(); Pkg.add("oneAPI")'
      - name: Run benchmark (main)
        working-directory: benchmark
        run: julia --startup-file=no runbenchmark.jl main oneapi
      - name: Run benchmark (current)
        working-directory: benchmark
        run: julia --startup-file=no runbenchmark.jl current oneapi
      - uses: actions/upload-artifact@v4
        with:
          name: results-oneapi
          path: benchmark/benchmark-results-*.csv

  compare:
    needs: [bench-nothing, bench-cuda, bench-amdgpu, bench-oneapi]
    if: always() && github.event_name == 'pull_request' && contains(needs.*.result, 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'
      - name: Instantiate
        working-directory: benchmark
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.Registry.update(); Pkg.instantiate()'
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: benchmark
          merge-multiple: true
      - name: Compare
        working-directory: benchmark
        run: julia --startup-file=no --project=. compare.jl | tee comparison.txt
      - name: Save PR number
        working-directory: benchmark
        run: echo "${{ github.event.pull_request.number }}" > pr_number.txt
      - name: Upload comparison artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-comparison
          path: |
            benchmark/comparison.txt
            benchmark/pr_number.txt

  # ExaModelsC compiles a model into a native shared library with juliac, so it
  # is platform-specific in a way the rest of the package is not. Not on GPU
  # runners, where it is not expected to work yet, and not on Windows: juliac
  # implements runtime privatization only for Linux and macOS, so a library
  # compiled there cannot be loaded back into Julia (see `compile_library`).
  examodelsc:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: '["self-hosted","Linux","examodels"]'
            name: linux
          - runner: '["self-hosted","macOS","examodels"]'
            name: macos
    name: examodelsc (${{ matrix.name }})
    runs-on: ${{ fromJSON(matrix.runner) }}
    steps:
      - uses: actions/checkout@v4
      # The Python consumer is an unrelated package and not a Julia dependency;
      # the test finds it through CNLPMODELS_PY and skips the leg if absent.
      - uses: actions/checkout@v4
        with:
          repository: MadNLP/cnlpmodels-py
          ref: master
          path: cnlpmodels-py
      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      # No `setup-python` here: both legs are self-hosted, and that action
      # assumes the hosted layout — it tries to write to `/Users/runner`, which
      # on a self-hosted Mac does not exist (`mkdir: Permission denied`), and
      # takes the job with it. The runners have their own Python; the test
      # probes for one with numpy and skips that leg when it finds none.
      - name: Run ExaModelsC tests
        env:
          CNLPMODELS_PY: ${{ github.workspace }}/cnlpmodels-py/src
        run: |
          julia --startup-file=no --color=yes --project=ExaModelsC/test -e '
            using Pkg
            Pkg.instantiate()
            include("ExaModelsC/test/runtests.jl")'
